org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official

# The one place the version is written down. Bump both together, and bump versionCode for every
# published APK — it is what the update check compares against the server's manifest.
recorder.versionCode=6
recorder.versionName=0.6

# Where the update check looks for the release manifest. Overridable on the command line
# (-Precorder.updateManifestUrl=…) to point a test build at a manifest of your own.
recorder.updateManifestUrl=https://download.freemap.sk/freemap-gps-recorder/latest.json

# Where the published APK sits, written into the generated latest.json as apkUrl. One unversioned
# filename, so it must be served without long-lived caching or the browser hands back the old APK.
recorder.apkUrl=https://download.freemap.sk/freemap-gps-recorder/freemap-gps-recorder.apk

# The oldest build freemap.sk can still follow. Raise this only when the website genuinely stops
# working with older recorders: it tells them so in a prompt they cannot dismiss for good.
recorder.minSupportedVersionCode=1

# Shown in the update prompt. Keep it to what a user would want to know before installing.
#
# ASCII only. Gradle reads this file as ISO-8859-1, so a UTF-8 dash or accent here arrives in
# latest.json as mojibake and ships that way to every update prompt.
recorder.releaseNotes=Pause and resume a recording without ending it. Recording settings (interval, minimum distance, accuracy filter, power priority) can now be set from the website. Tracks remember where they were paused, and each point carries more detail for a faithful GPX export.
